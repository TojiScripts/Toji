<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toji Script Hub</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:
    radial-gradient(circle at top,#3a0000,#0a0a0a 70%);
}

.container{
    width:100%;
    max-width:850px;
}

.card{
    background:rgba(0,0,0,.85);
    border:1px solid rgba(255,255,255,.08);
    border-radius:32px;
    padding:35px;
    backdrop-filter:blur(25px);
    box-shadow:0 0 50px rgba(255,0,0,.15);
}

.header{
    display:flex;
    align-items:center;
    gap:20px;
    margin-bottom:30px;
}

.logo{
    width:80px;
    height:80px;
    border-radius:18px;
    object-fit:cover;
}

.title h1{
    color:#fff;
    letter-spacing:8px;
    font-size:42px;
    font-weight:300;
}

.title p{
    color:#8d8d8d;
    letter-spacing:5px;
    margin-top:5px;
}

.script-box{
    background:#050505;
    border:1px solid rgba(255,255,255,.05);
    border-radius:20px;
    padding:25px;
    overflow:auto;
}

.script{
    color:#6cff6c;
    font-family:monospace;
    font-size:17px;
}

.copy-btn{
    width:100%;
    margin-top:20px;
    padding:18px;
    border:none;
    border-radius:18px;
    background:linear-gradient(90deg,#8b0000,#c40000);
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

.copy-btn:hover{
    transform:translateY(-2px);
}

.divider{
    margin:35px 0;
    height:1px;
    background:rgba(255,255,255,.08);
}

.section-title{
    color:#888;
    letter-spacing:4px;
    margin-bottom:20px;
}

.game{
    display:flex;
    align-items:center;
    gap:12px;
    color:white;
    padding:16px 0;
    border-bottom:1px solid rgba(255,255,255,.06);
    font-size:20px;
}

.footer{
    text-align:center;
    margin-top:30px;
}

.socials a{
    color:#bdbdbd;
    text-decoration:none;
    margin:0 15px;
    font-size:18px;
}

.socials a:hover{
    color:white;
}

.copyright{
    color:#555;
    margin-top:20px;
    font-size:14px;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<div class="header">
<img class="logo" src="logo.png">

<div class="title">
<h1>TOJI SCRIPT</h1>
<p>PREMIUM SCRIPT HUB</p>
</div>
</div>

<div class="script-box">
<div class="script">
loadstring(game:HttpGet("https://tojiscript.xyz/loader.lua"))()
</div>
</div>

<button class="copy-btn" onclick="copyScript()">
📋 COPY SCRIPT
</button>

<div class="divider"></div>

<h3 class="section-title">SUPPORTED GAMES</h3>

<div class="game">🧠 Steal a Brainrot</div>
<div class="game">🥚 Grow a Garden</div>
<div class="game">🔪 Murder Mystery 2</div>
<div class="game">⚔️ Blade Ball</div>
<div class="game">🐾 Pet Simulator</div>

<div class="footer">

<div class="socials">
<a href="#">📺 YouTube</a>
<a href="#">💬 Discord</a>
<a href="#">🌐 Website</a>
</div>

<div class="copyright">
© 2026 Toji Script Hub. All rights reserved.
</div>

</div>

</div>

</div>

<script>
function copyScript(){
navigator.clipboard.writeText(
'loadstring(game:HttpGet("https://tojiscript.xyz/loader.lua"))()'
);
alert("Script copied successfully!");
}
</script>

</body>
</html>
